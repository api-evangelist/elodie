name: Elodie
description: >-
  Elodie Games is an independent video game studio founded in 2019 and
  headquartered in Venice, California, building endlessly-playable cross-play PvE
  cooperative games for PC, console, and mobile. Co-founded by Christina Norman
  (design leadership on Mass Effect 1-3, League of Legends, and League of
  Legends: Wild Rift) and David Banks (former executive producer of League of
  Legends at Riot Games), the studio is focused on deeply social, cross-platform
  gameplay so friends and family can play together regardless of device or skill
  level. Elodie's Series A was co-led by Andreessen Horowitz (a16z) and Galaxy
  Interactive. Elodie publishes no public developer API, SDK, or documentation
  portal; its backend stack (AWS, Kotlin, gRPC/Protobuf, DynamoDB, MySQL) is
  internal-only, so there is no API artifact surface to enrich for this provider.
